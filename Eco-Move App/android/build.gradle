// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}


// Keep native object paths below Windows' limit, including paths from codegen.
subprojects { subproject ->
  afterEvaluate {
    if (subproject.plugins.hasPlugin('com.android.application') || subproject.plugins.hasPlugin('com.android.library')) {
      subproject.android {
        defaultConfig {
          externalNativeBuild {
            cmake { arguments '-DCMAKE_OBJECT_PATH_MAX=220', '-DCMAKE_JOB_POOLS=compile=2;link=1', '-DCMAKE_JOB_POOL_COMPILE=compile', '-DCMAKE_JOB_POOL_LINK=link' }
          }
        }
        externalNativeBuild {
          cmake { buildStagingDirectory file("${System.getenv('ECO_NATIVE_STAGE') ?: "${rootDir}/../toolchain/cxx"}/${subproject.name}") }
        }
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
